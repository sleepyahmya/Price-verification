<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Verification</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="desktop">
        <div class="window-shell">
            <header class="window-topbar">
                <div class="window-title">PRICE VERIFICATION</div>
                <div class="window-controls">
                    <button class="control">_</button>
                    <button class="control">▢</button>
                    <button class="control">×</button>
                </div>
            </header>

            <div class="window-body">
                <div class="verify-panel">
                    <div class="verify-title">PRICE VERIFICATION</div>
                    <div class="verify-row">
                        <label for="productSelect">PRODUCT NAME</label>
                        <select id="productSelect">
                            <option value="" selected>SELECT PRODUCT</option>
                        </select>
                    </div>
                    <button type="button" id="getPriceBtn">GET PRICE</button>
                    <p id="priceDisplay">Price : P 0.00</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
